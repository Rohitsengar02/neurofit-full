# NeuroFit API on Render (free plan). Secrets (R2, LiveKit, Google, admin login)
# are set on the service's Environment page, not in this file.
databases:
  - name: neurofit-db
    plan: free
    region: singapore
    databaseName: neurofit_db
    user: neurofit_db_user
    ipAllowList: []

services:
  - type: web
    name: neurofit-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: neurofit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_MAX
        value: "10"
