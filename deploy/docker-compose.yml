# NeuroFit API on your own server (Hostinger VPS) at https://api.bitechez.com
#   neurofit-api    NeuroFit API + live updates (socket.io)   -> ../server/Dockerfile
#   neurofit-db     database (PostgreSQL 16, data kept in a Docker volume)
#   neurofit-cache  cache (Valkey 8, the free open-source Redis)
#   caddy           HTTPS, only when this server has no BiteChez Caddy already (profile "standalone")
# Service names start with "neurofit-" on purpose: the API also joins the BiteChez network, where
# plain names like "api", "postgres" and "valkey" already belong to BiteChez.
# Secrets live in deploy/.env (made by deploy/install.sh). Never commit that file.

name: neurofit

services:
  neurofit-api:
    build: ../server
    image: neurofit-api:latest
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://neurofit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@neurofit-db:5432/neurofit
      REDIS_URL: redis://:${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}@neurofit-cache:6379
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    depends_on:
      neurofit-db:
        condition: service_healthy
      neurofit-cache:
        condition: service_healthy
    networks:
      default:
      edge:

  neurofit-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neurofit
      POSTGRES_USER: neurofit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ['postgres', '-c', 'max_connections=200', '-c', 'shared_buffers=256MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neurofit -d neurofit']
      interval: 5s
      timeout: 5s
      retries: 20

  neurofit-cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD}', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  caddy:
    profiles: [standalone]
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.bitechez.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [neurofit-api]

networks:
  # The BiteChez stack's network when it runs on the same server, so its Caddy can reach "neurofit-api".
  # install.sh sets EDGE_NETWORK (and creates neurofit_edge on a server without BiteChez).
  edge:
    name: ${EDGE_NETWORK:-neurofit_edge}
    external: true

volumes:
  pgdata:
  caddy-data:
  caddy-config:
